<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Helvetica, Arial, sans-serif" fill="#14171f">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#14171f"/>
    </marker>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>

  <!-- the three containers -->
  <rect x="250" y="40" width="700" height="290" fill="#f3f5fa" stroke="#14171f" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="266" y="66" font-size="15" font-weight="700">docker compose up</text>

  <g stroke="#14171f" stroke-width="2" fill="#ffffff">
    <rect x="20" y="130" width="170" height="110"/>
    <rect x="290" y="110" width="180" height="150"/>
    <rect x="510" y="110" width="180" height="150"/>
    <rect x="730" y="110" width="180" height="150"/>
    <rect x="1010" y="130" width="170" height="110"/>
    <rect x="290" y="400" width="180" height="90"/>
    <rect x="510" y="400" width="180" height="90"/>
  </g>
  <rect x="290" y="110" width="180" height="6" fill="#2450f0"/>
  <rect x="510" y="110" width="180" height="6" fill="#2450f0"/>
  <rect x="730" y="110" width="180" height="6" fill="#2450f0"/>

  <g text-anchor="middle">
    <text x="105" y="172" font-size="18" font-weight="700">openFDA</text>
    <text x="105" y="196" font-size="13">14 zip files, 1.87 GB</text>
    <text x="105" y="214" font-size="13">downloaded over HTTPS</text>

    <text x="380" y="150" font-size="18" font-weight="700">loader</text>
    <text x="380" y="176" font-size="13">Python script, runs once</text>
    <text x="380" y="196" font-size="13">downloads the zips,</text>
    <text x="380" y="214" font-size="13">keeps the usable labels,</text>
    <text x="380" y="232" font-size="13">loads them</text>

    <text x="600" y="150" font-size="18" font-weight="700">db</text>
    <text x="600" y="176" font-size="13">PostgreSQL 16</text>
    <text x="600" y="196" font-size="13">84,381 labels</text>
    <text x="600" y="214" font-size="13">word index (GIN)</text>
    <text x="600" y="232" font-size="13">on the indications text</text>

    <text x="820" y="150" font-size="18" font-weight="700">app</text>
    <text x="820" y="176" font-size="13">FastAPI and a static page</text>
    <text x="820" y="196" font-size="13">runs the SQL queries,</text>
    <text x="820" y="214" font-size="13">starts after the loader</text>
    <text x="820" y="232" font-size="13">has finished</text>

    <text x="1095" y="172" font-size="18" font-weight="700">browser</text>
    <text x="1095" y="196" font-size="13">localhost:8080, the user</text>
    <text x="1095" y="214" font-size="13">types a condition</text>

    <text x="380" y="436" font-size="16" font-weight="700">./data on the laptop</text>
    <text x="380" y="458" font-size="13">the zips and the kept rows</text>
    <text x="380" y="476" font-size="13">(one CSV), never in git</text>

    <text x="600" y="436" font-size="16" font-weight="700">dbdata volume</text>
    <text x="600" y="458" font-size="13">the database files,</text>
    <text x="600" y="476" font-size="13">they survive a restart</text>
  </g>

  <g stroke="#14171f" stroke-width="2" fill="none">
    <line x1="190" y1="185" x2="288" y2="185" marker-end="url(#a)"/>
    <line x1="470" y1="185" x2="508" y2="185" marker-end="url(#a)"/>
    <line x1="728" y1="170" x2="692" y2="170" marker-end="url(#a)"/>
    <line x1="690" y1="205" x2="728" y2="205" marker-end="url(#a)"/>
    <line x1="910" y1="185" x2="1008" y2="185" marker-end="url(#a)"/>
    <line x1="380" y1="262" x2="380" y2="398" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="600" y1="262" x2="600" y2="398" marker-start="url(#a)" marker-end="url(#a)"/>
  </g>

  <g font-size="12" fill="#3a4050" text-anchor="middle">
        <text x="490" y="96">rows</text>
    <text x="710" y="96">SQL, results</text>
  </g>
  <g font-size="12" fill="#3a4050">
    <text x="392" y="368">saved once, read again on later starts</text>
  </g>
</svg>
