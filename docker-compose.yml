# One command starts everything: docker compose up
services:

  db:
    image: postgres:16                 # ready-made PostgreSQL image, we do not build it
    env_file: .env                     # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD
    volumes:
      - dbdata:/var/lib/postgresql/data   # named volume: the data survives "docker compose down"
    healthcheck:                       # the others wait until the database accepts connections
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    # no "ports": only the page is opened to the laptop

  loader:
    build:
      context: .                       # the repo root, so the image can include sql/
      dockerfile: loader/Dockerfile
    env_file: .env
    environment:                       # run settings: defaults here, override from the shell
      SAMPLE_FRACTION: ${SAMPLE_FRACTION:-1.0}   # share of the labels to load: 0.25 / 0.5 / 1.0
      EXTRACT_CACHE: ${EXTRACT_CACHE:-1}         # 1 = reuse the saved CSV in data/clean, 0 = read the zips again
      DATA_DIR: /data
    volumes:
      - ${DATA_PATH:-./data}:/data     # downloaded zips in data/raw, saved CSV in data/clean
    depends_on:
      db:
        condition: service_healthy     # start only when the database is ready
    # runs once: download, clean, load, index, then exits with code 0

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file: .env
    ports:
      - "${APP_PORT:-8080}:8080"       # the only open port: http://localhost:8080
    depends_on:
      loader:
        condition: service_completed_successfully   # the page starts only after a successful load

volumes:
  dbdata:
