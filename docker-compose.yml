services:

  db:
    image: postgres:16
    env_file: .env
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  # Runs once and exits: downloads the labels and loads them.
  loader:
    build:
      context: .
      dockerfile: loader/Dockerfile
    env_file: .env
    environment:
      SAMPLE_FRACTION: ${SAMPLE_FRACTION:-1.0}   # 0.25, 0.5 or 1.0
      EXTRACT_CACHE: ${EXTRACT_CACHE:-1}         # 0 = read the zips again
    volumes:
      - ${DATA_PATH:-./data}:/data
    depends_on:
      db:
        condition: service_healthy

  # The page, on http://localhost:8080. It waits for the loader, so it never shows half the data.
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file: .env
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      loader:
        condition: service_completed_successfully

volumes:
  dbdata:
