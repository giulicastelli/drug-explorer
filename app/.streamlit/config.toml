# One dark theme for the whole page (docs/design_system.md).
# Colours: a validated data-visualisation palette, dark mode (page plane, chart surface, ink);
# accent violet = slot 7, never used for data on this page, so it cannot be read as Rx or OTC.
# Type: Fira Sans for text, Fira Code for numbers and code (a "data-dense dashboard" style).
# The fonts come from Google Fonts; offline, the browser falls back to its own sans-serif.
[theme]
base = "dark"
primaryColor = "#9085e9"
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#1a1a19"
textColor = "#f0efec"
borderColor = "#2c2c2a"
linkColor = "#9085e9"
baseRadius = "6px"
font = "Fira Sans:https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap"
codeFont = "Fira Code:https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#898781"]

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
